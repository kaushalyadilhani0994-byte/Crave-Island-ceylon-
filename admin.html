<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#2C1A14">
  <title>Secure Owner Access | CRAVE ISLAND CEYLON</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#2C1A14;color:#FFF8E7;font:14px/1.5 system-ui,sans-serif}
    #storefront{display:block;border:0;width:100%;height:100%;background:#FFF8E7}
    #status{position:fixed;z-index:10;left:12px;right:12px;top:12px;margin:auto;max-width:420px;padding:12px 16px;border:1px solid #D4AF37;border-radius:12px;background:#2C1A14;color:#FFF8E7;text-align:center;box-shadow:0 8px 28px #0004}
    #status[hidden]{display:none}
    #status a{color:#efd27b}
  </style>
</head>
<body>
  <div id="status" role="status" aria-live="polite">Opening secure owner sign-in…</div>
  <iframe id="storefront" title="CRAVE ISLAND CEYLON secure owner sign-in" src="/?owner-access=1" referrerpolicy="same-origin"></iframe>
  <script>
    (function(){
      const frame=document.getElementById("storefront");
      const status=document.getElementById("status");
      let attempts=0;
      function check(){
        try{
          const d=frame.contentWindow.document;
          const splash=d.querySelector(".splash");
          if(splash)splash.classList.add("hide");
          const modal=d.getElementById("adminAccessModal");
          if(modal && (modal.classList.contains("open") || modal.getAttribute("aria-hidden")==="false" || (modal.style.display && modal.style.display!=="none"))){
            status.hidden=true;
            return;
          }
        }catch(_){}
        attempts++;
        if(attempts<80){setTimeout(check,250);return;}
        status.innerHTML='Sign-in did not open automatically. <a href="/?owner-access=1" target="_top">Tap here to open secure owner sign-in</a>.';
      }
      frame.addEventListener("load",function(){setTimeout(check,250);});
      setTimeout(check,500);
    })();
  </script>
</body>
</html>
